name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK and generate checksum
        run: |
          apk_name="eink-music-${GITHUB_REF_NAME}.apk"
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eink-music-*.apk
            eink-music-*.apk.sha256
          generate_release_notes: true
