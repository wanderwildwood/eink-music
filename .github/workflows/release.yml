name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleFossRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/foss/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          OUT="eink-music-${TAG}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
          generate_release_notes: true
